<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="tg-solver pipeline: from a group message to a sent reply or a held draft">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B949E"/></marker><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#171C24" stroke-width="1"/></pattern></defs>
<rect width="1200" height="420" fill="#0D1117"/><rect width="1200" height="420" fill="url(#g)"/>
<rect x="30" y="24" width="220" height="100" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="140.0" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Group message</text>
<text x="140.0" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">text and photos</text>
<rect x="260" y="24" width="220" height="100" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="370.0" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Listener</text>
<text x="370.0" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">every 15 s, no LLM</text>
<rect x="490" y="24" width="220" height="100" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="600.0" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Batch</text>
<text x="600.0" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">45 s of quiet,</text>
<text x="600.0" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">one request</text>
<rect x="720" y="24" width="220" height="100" rx="10" fill="#1B2340" stroke="#6E8BFF" stroke-width="2.5"/>
<text x="830.0" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Triage</text>
<text x="830.0" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">small model:</text>
<text x="830.0" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">task or not</text>
<rect x="950" y="24" width="220" height="100" rx="10" fill="#1B2340" stroke="#6E8BFF" stroke-width="2.5"/>
<text x="1060.0" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Solve</text>
<text x="1060.0" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">large model,</text>
<text x="1060.0" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">JSON only</text>
<line x1="250" y1="74" x2="260" y2="74" stroke="#8B949E" stroke-width="2" marker-end="url(#a)"/>
<line x1="480" y1="74" x2="490" y2="74" stroke="#8B949E" stroke-width="2" marker-end="url(#a)"/>
<line x1="710" y1="74" x2="720" y2="74" stroke="#8B949E" stroke-width="2" marker-end="url(#a)"/>
<line x1="940" y1="74" x2="950" y2="74" stroke="#8B949E" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="190" width="220" height="100" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="140.0" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Lint</text>
<text x="140.0" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">phone-width rules,</text>
<text x="140.0" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">one reformat pass</text>
<rect x="290" y="190" width="270" height="100" rx="10" fill="#1B2340" stroke="#6E8BFF" stroke-width="2.5"/>
<text x="425.0" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Verify</text>
<text x="425.0" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">independent re-solve,</text>
<text x="425.0" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">compares every number</text>
<rect x="600" y="190" width="270" height="100" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="735.0" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Code gates</text>
<text x="735.0" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">statement matches,</text>
<text x="735.0" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">no earlier contradiction</text>
<rect x="960" y="190" width="210" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="1065.0" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Send</text>
<text x="1065.0" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9"></text>
<rect x="960" y="252" width="210" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="1065.0" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">Hold as draft</text>
<text x="1065.0" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9"></text>
<line x1="1060" y1="124" x2="140" y2="190" stroke="#8B949E" stroke-width="2" marker-end="url(#a)"/>
<line x1="250" y1="240" x2="290" y2="240" stroke="#8B949E" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="240" x2="600" y2="240" stroke="#8B949E" stroke-width="2" marker-end="url(#a)"/>
<line x1="870" y1="224" x2="960" y2="213" stroke="#8B949E" stroke-width="2" marker-end="url(#a)"/>
<text x="880" y="198" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="15" fill="#8B949E">pass</text>
<line x1="870" y1="256" x2="960" y2="275" stroke="#8B949E" stroke-width="2" marker-end="url(#a)"/>
<text x="880" y="300" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="15" fill="#8B949E">any gate fails</text>
<text x="30" y="345" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="20" fill="#E6EDF3">The model has no tools and returns JSON only; Python alone sends.</text>
<text x="30" y="375" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="17" fill="#B4BDC9">A reply that fails a gate or the verifier is held for the owner instead of being sent.</text>
</svg>
